<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;font-family:Arial;background:#111;color:#fff}header{padding:10px}select,input,button{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:0}button{background:#a3e635;font-weight:700}#map{height:50vh}.card{background:#222;padding:10px;margin:8px;border-radius:8px;border-left:4px solid #a3e635}.p{color:#a3e635;font-weight:700}</style></head><body><header><h3>📡 RADAR CANTABRIA</h3><select id="t"><option value="estetica">Estética</option><option value="peluqueria">Peluquería</option><option value="dentista">Dentista / Clínica</option><option value="bares">Bares</option><option value="tiendas">Tiendas</option><option value="gimnasio">Gimnasio</option><option value="todos">Todos</option></select><select id="c"><option>Santander</option><option>Torrelavega</option><option>Castro Urdiales</option><option>Laredo</option><option>Camargo</option><option>Piélagos</option></select><input id="u" placeholder="Otro pueblo..."><button onclick="s()">🔍 ESCANEAR</button><p id="st">Listo</p></header><div id="map"></div><div id="l"></div><script>
let map=L.map('map').setView([43.4623,-3.8099],13);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);let M=[];
let Q={estetica:'node["shop"="beauty"](around:5000,LA,LO);node["shop"="nails"](around:5000,LA,LO);node["amenity"="spa"](around:5000,LA,LO);',peluqueria:'node["shop"="hairdresser"](around:5000,LA,LO);node["shop"="barber"](around:5000,LA,LO);',dentista:'node["amenity"="dentist"](around:5000,LA,LO);node["amenity"="clinic"](around:5000,LA,LO);',bares:'node["amenity"="restaurant"](around:5000,LA,LO);node["amenity"="bar"](around:5000,LA,LO);node["amenity"="cafe"](around:5000,LA,LO);',tiendas:'node["shop"](around:5000,LA,LO);',gimnasio:'node["leisure"="fitness_centre"](around:5000,LA,LO);',todos:'node["shop"](around:5000,LA,LO);node["amenity"](around:5000,LA,LO);'};
async function s(){let ci=document.getElementById('u').value||document.getElementById('c').value;let ti=document.getElementById('t').value;document.getElementById('st').innerText='Buscando en '+ci+'...';M.forEach(m=>map.removeLayer(m));let g=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(ci+', Cantabria, España')).then(r=>r.json());if(!g[0])return alert('Pueblo no encontrado');let la=g[0].lat,lo=g[0].lon;map.setView([la,lo],14);let q='[out:json];('+Q[ti].replaceAll('LA',la).replaceAll('LO',lo)+');out;';let r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q)).then(r=>r.json());let h='';r.elements.forEach(e=>{let t=e.tags||{};if(!t.name)return;let p=300;let mo=[];if(!t.website){p+=150;mo.push('Sin web')}if(!t['contact:instagram']){p+=100;mo.push('Sin redes')}mo.push('Reserva+Web');L.circleMarker([e.lat,e.lon],{radius:8,color:'#a3e635'}).addTo(map).bindPopup(t.name+' '+p+'€');h+=`<div class=card><b>${t.name}</b><br><span class=p>${p}€</span> - ${mo.join(' • ')}<br><small>${t.phone||'Sin teléfono'} | ${t.website?'Tiene web':'SIN WEB'}</small></div>`});document.getElementById('l').innerHTML=h||'Sin resultados, prueba otro pueblo';document.getElementById('st').innerText=r.elements.length+' negocios en '+ci}
</script></body></html>
